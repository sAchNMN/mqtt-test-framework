services:
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: mqtt-test-mosquitto
    ports:
      - "1883:1883"
    volumes:
      # 不加 :ro —— eclipse-mosquitto 的 entrypoint 会 chown 配置文件，
      # 只读挂载会导致 "chown: Read-only file system" 报错（虽不致命，但会干扰排查）
      - ./docker/mosquitto.conf:/mosquitto/config/mosquitto.conf
    healthcheck:
      # 用 pub -q 1 探测（发布并等 PUBACK），不要用 sub 订阅 $SYS：
      # mosquitto.conf 里 sys_interval=0 已禁用 $SYS 更新，订阅它会永远等不到消息
      test: ["CMD-SHELL", "mosquitto_pub -h 127.0.0.1 -q 1 -t internal/health-probe -m ok"]
      interval: 5s
      timeout: 5s
      retries: 6
      start_period: 3s

  emqx:
    image: emqx/emqx:5.8
    container_name: mqtt-test-emqx
    profiles: ["emqx"]
    ports:
      - "1885:1883"
      - "18083:18083"
    environment:
      EMQX_ALLOW_ANONYMOUS: "true"
    healthcheck:
      test: ["CMD", "emqx", "ctl", "status"]
      interval: 10s
      timeout: 8s
      retries: 10
      start_period: 20s
