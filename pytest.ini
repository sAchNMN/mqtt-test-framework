[pytest]
pythonpath = .
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    -v
    --strict-markers
    --tb=short
    --timeout=120
    -p no:cacheprovider

markers =
    smoke: 冒烟层，最快、最基础的一批
    qos: QoS 投递语义
    lwt: 遗嘱消息（Last Will and Testament）
    retain: 保留消息
    session: 会话管理（Clean Session / 持久会话）
    concurrency: 并发与压力场景
    slow: 耗时较长的用例

filterwarnings =
    ignore:.*psutil.*:DeprecationWarning

log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(name)s: %(message)s
log_cli_date_format = %H:%M:%S
